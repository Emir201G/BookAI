spring.application.name=BookAi

# ===============================
# DATASOURCE
# ===============================
# Se cambi\uFFFD serverTimezone a America/Argentina/Buenos_Aires
#spring.datasource.url=jdbc:mysql://localhost:3306/bookai?useSSL=false&serverTimezone=America/Argentina/Buenos_Aires&allowPublicKeyRetrieval=true
spring.datasource.url=jdbc:mysql://localhost:3306/bookai?useUnicode=true&characterEncoding=UTF-8

spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Se agrega esta propiedad para que Hibernate use la misma zona horaria en las consultas
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires

# ===============================
# MYSQL
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# SERVER
# ===============================
server.port=8080



logging.level.org.hibernate.orm.jdbc.bind=TRACE