# =========================================
# APPLICATION
# =========================================

spring.application.name=BookAi


# =========================================
# DATASOURCE - MYSQL
# =========================================

spring.datasource.url=jdbc:mysql://localhost:3306/bookai?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================
# JPA / HIBERNATE
# =========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires

logging.level.org.hibernate.orm.jdbc.bind=TRACE

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# =========================================
# SERVER
# =========================================

server.port=8080


# =========================================
# SPRING AI + DEEPSEEK
# =========================================

spring.ai.model.chat=openai

spring.ai.openai.api-key=${DEEPSEEK_API_KEY}
spring.ai.openai.base-url=https://api.deepseek.com

spring.ai.openai.chat.options.model=deepseek-flash
spring.ai.openai.chat.options.temperature=0.2
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

# =========================================
# WHATSAPP CLOUD API
# =========================================

whatsapp.api.base-url=https://graph.facebook.com
whatsapp.api.version=v23.0
whatsapp.api.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID}
whatsapp.api.access-token=${WHATSAPP_ACCESS_TOKEN}
whatsapp.webhook.verify-token=bookai-webhook-2026
bookai.owner.phone-number=5492966734851